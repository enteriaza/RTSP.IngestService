name: Build and Validate

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  # FFmpeg interoperability tests fail instead of skipping when FFmpeg or ffprobe is missing.
  RTSP_FFMPEG_REQUIRED: "true"

jobs:
  build-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            executable: RTSP.IngestService
          - os: windows-latest
            rid: win-x64
            executable: RTSP.IngestService.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK (repo pin)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Verify pinned SDK version
        shell: bash
        run: |
          set -euo pipefail
          expected="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' global.json | head -n1)"
          actual="$(dotnet --version | tr -d '\r')"
          echo "global.json sdk.version=$expected"
          echo "dotnet --version=$actual"
          if [ "$actual" != "$expected" ]; then
            echo "SDK mismatch: expected exactly '$expected' from global.json, got '$actual'."
            exit 1
          fi

      - name: Verify solution project set
        shell: bash
        run: |
          set -euo pipefail
          disk_list="$(mktemp)"
          sln_list="$(mktemp)"
          find src tests -name '*.csproj' | sed 's|\\|/|g' | sed 's|^\./||' | sort -u > "$disk_list"
          dotnet sln RTSP.slnx list | tr -d '\r' | sed 's|\\|/|g' | sed 's|^\./||' | grep '\.csproj$' | sort -u > "$sln_list"
          if ! cmp -s "$disk_list" "$sln_list"; then
            echo "Solution membership does not match every project under src/ and tests/."
            echo "On disk but not in RTSP.slnx:"
            comm -23 "$disk_list" "$sln_list"
            echo "In RTSP.slnx but missing on disk:"
            comm -13 "$disk_list" "$sln_list"
            exit 1
          fi
          echo "Solution projects:"
          cat "$sln_list"

      - name: Verify no nested Directory.Build policy files
        shell: bash
        run: |
          set -euo pipefail
          # Nested Directory.Build.props/.targets/.rsp use MSBuild nearest-wins and would shadow the repository-root
          # policy (net10.0, nullable, warnings as errors).
          nested="$(find . \( -name 'Directory.Build.props' -o -name 'Directory.Build.targets' -o -name 'Directory.Build.rsp' \) \
            ! -path './.git/*' ! -path '*/bin/*' ! -path '*/obj/*' | sed 's|^\./||' \
            | grep -v -x -e 'Directory.Build.props' -e 'Directory.Build.targets' || true)"
          if [ -n "$nested" ]; then
            echo "Nested Directory.Build files are forbidden:"
            echo "$nested"
            exit 1
          fi

      - name: Verify every project targets net10.0
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r proj; do
            tf="$(dotnet msbuild "$proj" -nologo -getProperty:TargetFramework | tr -d '\r')"
            tfs="$(dotnet msbuild "$proj" -nologo -getProperty:TargetFrameworks | tr -d '\r')"
            if [ -n "$tfs" ] || [ "$tf" != "net10.0" ]; then
              echo "Project must target exactly net10.0: $proj => TargetFramework='$tf' TargetFrameworks='$tfs'"
              fail=1
            else
              echo "OK $proj => net10.0"
            fi
          done < <(find . -name '*.csproj' ! -path './.git/*' ! -path '*/bin/*' ! -path '*/obj/*' | sed 's|^\./||' | sort -u)
          exit "$fail"

      # Distribution FFmpeg packages are too old: FFmpeg 7.0 and earlier omit packet durations when demuxing fMP4 HLS,
      # which the interoperability tests assert. Install the current BtbN 9.0 release-branch build on both runners.
      - name: Install FFmpeg 9.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FFMPEG_PLATFORM: ${{ runner.os == 'Windows' && 'win64' || 'linux64' }}
        run: |
          set -euo pipefail
          ext=$([ "$FFMPEG_PLATFORM" = win64 ] && echo zip || echo tar.xz)
          asset="$(gh release view latest --repo BtbN/FFmpeg-Builds --json assets --jq '.assets[].name' \
            | grep -E "^ffmpeg-n9\.0.*-${FFMPEG_PLATFORM}-gpl-9\.0\.(zip|tar\.xz)$" | grep -F ".${ext}" | head -n1 || true)"
          test -n "$asset"
          echo "FFmpeg asset: $asset"
          dir="$RUNNER_TEMP/ffmpeg"
          gh release download latest --repo BtbN/FFmpeg-Builds --pattern "$asset" --dir "$RUNNER_TEMP"
          mkdir -p "$dir"
          if [ "$ext" = zip ]; then
            unzip -q "$RUNNER_TEMP/$asset" -d "$dir"
          else
            tar -xJf "$RUNNER_TEMP/$asset" -C "$dir"
          fi
          bin="$(dirname "$(find "$dir" -type f \( -name ffmpeg -o -name ffmpeg.exe \) | head -n1)")"
          if [ "$FFMPEG_PLATFORM" = win64 ]; then bin="$(cygpath -w "$bin")"; fi
          echo "$bin" >> "$GITHUB_PATH"

      - name: Show FFmpeg version
        shell: bash
        run: |
          ffmpeg -hide_banner -version | head -n1
          ffprobe -hide_banner -version | head -n1
          ffmpeg -hide_banner -encoders | grep -E 'libx264|aac'

      - name: Restore
        run: dotnet restore RTSP.slnx

      - name: Verify formatting
        run: dotnet format RTSP.slnx --verify-no-changes --no-restore

      - name: Build (Release)
        run: dotnet build RTSP.slnx --configuration Release --no-restore

      - name: Test (Release)
        timeout-minutes: 20
        run: dotnet test RTSP.slnx --configuration Release --no-build

      - name: Install Native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends clang zlib1g-dev

      - name: Publish Native AOT (${{ matrix.rid }})
        run: dotnet publish src/RTSP.IngestService/RTSP.IngestService.csproj --configuration Release --runtime ${{ matrix.rid }} --output artifacts/publish/${{ matrix.rid }}

      - name: Verify published output
        shell: bash
        run: |
          set -euo pipefail
          out="artifacts/publish/${{ matrix.rid }}"
          exe="$out/${{ matrix.executable }}"
          test -f "$exe"
          test -f "$out/appsettings.json"
          if ls "$out"/appsettings.Development*.json "$out"/appsettings.Production*.json >/dev/null 2>&1; then
            echo "Environment-specific settings must not be published."
            exit 1
          fi
          # Invalid configuration must exit with EX_CONFIG (78) from the native executable.
          set +e
          Http__Port=70000 "$exe" --environment Testing > /dev/null 2>&1
          code=$?
          set -e
          echo "Exit code for invalid configuration: $code"
          test "$code" -eq 78
