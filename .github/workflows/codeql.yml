name: CodeQL

# Results are kept as a SARIF workflow artifact (upload: never) because code scanning uploads are not enabled for
# this repository. To publish alerts instead, enable code scanning and set upload to "always".
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK (repo pin)
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Initialize CodeQL (C#)
        if: matrix.language == 'csharp'
        uses: github/codeql-action/init@v4
        with:
          config-file: ./.github/codeql/codeql-config.yml
          languages: csharp
          build-mode: manual

      - name: Initialize CodeQL (GitHub Actions workflows)
        if: matrix.language == 'actions'
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none
          queries: security-extended

      - name: Build solution
        if: matrix.language == 'csharp'
        run: |
          dotnet restore RTSP.slnx
          dotnet build RTSP.slnx --configuration Release --no-restore --no-incremental

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          output: codeql-sarif

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-sarif
          if-no-files-found: error
