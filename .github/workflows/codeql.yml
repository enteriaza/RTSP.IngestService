name: CodeQL

# DISABLED: GitHub code scanning is not available for this repository, so SARIF uploads are rejected.
# Only workflow_call is declared (GitHub requires a trigger) and no workflow calls this file, so it never
# runs. To reactivate, restore the push, pull_request, schedule and workflow_dispatch triggers.
on:
  workflow_call:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          config-file: ./.github/codeql/codeql-config.yml
          languages: csharp

      - name: Setup .NET SDK (repo pin)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore NMS.slnx

      - name: Build solution
        run: dotnet build NMS.slnx --configuration Release --no-restore --no-incremental

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: codeql-sarif

      - name: Filter generated bin/obj findings from SARIF
        shell: pwsh
        run: |
          $inputs = Get-ChildItem -Path codeql-sarif -Filter *.sarif -File -ErrorAction Stop
          if ($inputs.Count -lt 1) {
            throw "No SARIF files found under codeql-sarif/"
          }
          New-Item -ItemType Directory -Force -Path codeql-sarif-filtered | Out-Null
          foreach ($sarif in $inputs) {
            $out = Join-Path codeql-sarif-filtered $sarif.Name
            & ./deploy/CodeQL/Filter-CodeQlSarif.ps1 -InputPath $sarif.FullName -OutputPath $out -StripAcceptedSuppressions
          }

      - name: Upload filtered CodeQL SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: codeql-sarif-filtered
          category: ".github/workflows/codeql.yml:analyze"
